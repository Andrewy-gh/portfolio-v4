<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Andy Yu</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101114;
        color: #f5f5f5;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 38rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin-bottom: 0.75rem;
        font-size: clamp(2rem, 8vw, 4rem);
      }

      p {
        color: #c8c8c8;
        line-height: 1.6;
      }

      ul {
        padding: 0;
        list-style: none;
      }

      a {
        display: inline-block;
        margin-top: 0.5rem;
        color: #65bfff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 — Page not found</h1>
      <p>The requested path does not exist. Try one of these agent-friendly starting points:</p>
      <ul>
        <li><a href="/">Portfolio home</a></li>
        <li><a href="/sitemap.xml">XML sitemap</a></li>
        <li><a href="/llms.txt">Agent index (llms.txt)</a></li>
        <li><a href="/index.md">Portfolio in Markdown</a></li>
      </ul>
    </main>
  </body>
</html>
